[package]
name = "mute"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
log.workspace = true
mute-audio = { path = "../mute-audio" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
lofty.workspace = true
libc.workspace = true

[features]
# The performance log (Settings › Advanced): what the frame, the screen and the player cost.
perf = ["mute-audio/perf"]

[dev-dependencies]
tempfile.workspace = true

[lints.clippy]
match_bool = "warn"
undocumented_unsafe_blocks = "warn"
