[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
rust-version = "1.96"
license = "GPL-3.0-or-later"
repository = "https://github.com/bphenriques/mute-player"

[workspace.dependencies]
fontdue = "0.9"
libc = "0.2"
libloading = "0.8"
lofty = "0.25"
log = "0.4"
png = "0.17"
resvg = { version = "0.48", default-features = false }
tempfile = "3"
usvg = { version = "0.48", default-features = false }
